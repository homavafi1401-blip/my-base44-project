# Base44 sandbox environment — development servers only, no prebuilt images.
services:
  web:
    image: node:22-alpine
    working_dir: /app
    # Dependencies live in a named volume (bind mounts shadow image content),
    # so they are installed from the mounted lockfile on every start.
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PREVIEW_MODE
      # Vite >= 6.1 appends this to server.allowedHosts (preview proxy host).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - '3000:5173'
    restart: on-failure
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1']
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 90s

volumes:
  node_modules:
