# Dev/preview stack.
# Runs the Vite dev server straight from the checkout: edits under src/ are
# picked up live, dependencies are installed into a named volume on startup.
services:
  web:
    image: node:22-alpine
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      # Platform-provided allowlist for the preview hostname (Vite >= 6.1).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 150s
    labels:
      base44.project: "TastyBites"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  node_modules:
